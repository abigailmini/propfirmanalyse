<!doctype html><html><head><meta charset="utf-8"><style>
/* og.png source: render at 1200x630 (scripts/og.sh). Paper/ink + one lime marker, same tokens as site.css */
@font-face{font-family:B;src:url(../src/fonts/bricolage.woff2) format("woff2");font-weight:500 800}
@font-face{font-family:G;src:url(../src/fonts/geist.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:M;src:url(../src/fonts/geist-mono.woff2) format("woff2");font-weight:400 600}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f3f4f0;color:#141619;font-family:G,sans-serif;padding:52px 64px 0;display:flex;flex-direction:column}
.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #141619;padding-bottom:14px}
.logo{display:flex;align-items:center;gap:14px;font:700 32px/1 B;letter-spacing:-.03em}
.logo i{font-style:normal;font-weight:500}.logo svg{width:40px;height:40px}
.meta{font:500 15px/1 M;letter-spacing:.06em;text-transform:uppercase;color:#5a6068}
h1{font:800 92px/1 B;letter-spacing:-.03em;margin-top:48px}
h1 u{text-decoration:none;background:linear-gradient(transparent 60%,#c6f03a 60% 90%,transparent 90%);padding:0 4px;margin:0 -4px}
.row{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #141619}
.row div{padding:20px 0 40px;border-right:1px solid #d3d5ce;padding-left:20px}
.row div:first-child{padding-left:0}.row div:last-child{border-right:0}
.row b{display:block;font:600 40px/1 M;letter-spacing:-.03em}
.row span{display:block;margin-top:10px;font:500 14px/1.2 M;letter-spacing:.06em;text-transform:uppercase;color:#5a6068}
</style></head><body>
<div class="mast"><div class="logo"><svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#141619"/><rect x="5" y="5.5" width="14" height="3" fill="#c6f03a"/><rect x="5" y="10.5" width="10" height="3" fill="#f3f4f0"/><rect x="5" y="15.5" width="6" height="3" fill="#f3f4f0"/></svg><span>PropFirm<i>Analyse</i></span></div><div class="meta">Independent · Sourced · Dated</div></div>
<h1>Prop firms, compared<br><u>on the numbers.</u></h1>
<div class="row">
<div><b>Fees</b><span>Entry cost per $1K</span></div>
<div><b>Rules</b><span>Drawdown, daily loss</span></div>
<div><b>Payouts</b><span>Split &amp; cycle</span></div>
<div><b>Changes</b><span>Every rule edit, dated</span></div>
</div></body></html>
