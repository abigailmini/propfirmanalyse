<!doctype html><html><head><meta charset="utf-8"><style>
/* og.png source: render at 1200x630 (scripts/og.sh). White + navy ink + brand blue, same tokens as site.css */
@font-face{font-family:I;src:url(../src/fonts/instrument-sans.woff2) format("woff2");font-weight:400 700}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#ffffff;color:#0b1730;font-family:I,sans-serif;padding:52px 64px 0;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cfd4de;padding-bottom:18px}
.logo{display:flex;align-items:center}.logo img{height:48px;width:auto;display:block}
.meta{font:500 18px/1 I;color:#5a6680}
h1{font:600 88px/1.02 I;letter-spacing:-.035em;margin-top:52px}
h1 u{text-decoration:none;color:#3424f8}
.row{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #cfd4de;background:#f5f6f8;margin-left:-64px;margin-right:-64px;padding:0 64px}
.row div{padding:24px 0 40px;border-right:1px solid #e3e6ec;padding-left:22px}
.row div:first-child{padding-left:0}.row div:last-child{border-right:0}
.row b{display:block;font:600 34px/1 I;letter-spacing:-.02em}
.row span{display:block;margin-top:10px;font:500 17px/1.2 I;color:#5a6680}
</style></head><body>
<div class="mast"><div class="logo"><img src="../brand/logo-crop.png" alt="PropAnalyse"></div><div class="meta">Sourced from each firm's own site, dated</div></div>
<h1>Prop firms, compared<br><u>on the numbers.</u></h1>
<div class="row">
<div><b>Fees</b><span>Entry cost per $1K</span></div>
<div><b>Rules</b><span>Drawdown, daily loss</span></div>
<div><b>Payouts</b><span>Split and cycle</span></div>
<div><b>Changes</b><span>Every rule edit, dated</span></div>
</div></body></html>
